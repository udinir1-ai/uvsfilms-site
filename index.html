synopsis: "Every year, a quarter of all Israeli High School students embark on a school trip to Poland to commemorate the Holocaust. This trip is known in Israel as \"The Journey to Poland\". Since it began in the late 1980's, the traditional journey includes 100 teenagers, 4 concentration camps, 3 mass graves, 2 ghettos and 14 memorial services within 8 days, but the fact that many of the students upload videos of their journey to YouTube, is a newer phenomenon. As the last Holocaust survivors are nearing the end of their lives, young Israelis are eager to immortalize the collective trauma. Video sharing becomes a central tool in the commemoration efforts. Teenagers, teachers and parents film every testimony, gas chamber and ceremony, as well as late-night hang-outs at the hotel and video selfies. They edit their version of history and share the clips online, adding to an ever-expanding YouTube archive of more than 20,000 clips. #uploading_holocaust is a curation of these user-generated videos, offering a unique point of view of a new generation, while revealing a moving and troubling image of the way collective memory is formed in the web-age.",

synopsis: "While the world may be eternally grateful to Max Brod for preserving some of the greatest works of 20th century literature and transforming Franz Kafka into a global cultural icon, Kafka himself may be turning in his grave. Kafka’s final wish stated that “all that is left in my estate must be burned completely, without reading”, was famously disregarded by his closest friend, and the rest is literary history. However, nearly a century after Kafka’s untimely death, the fate of his invaluable manuscripts is at the heart of a heated debate involving millions of dollars and political wrangling between Israel and Germany. The film follows the manuscripts from their initial journey in Brod’s suitcase from Nazi occupied Europe to Israel, to their current location, gathering dust in a run down Tel Aviv apartment, closely guarded by an unstable, eccentric woman and dozens of cats. The result is a twisted, bizarre detective story, whose irony and absurdity would not have been lost on the great man himself.",

<section class="section"><div class="sec-head"><h3>${t("screenings")}</h3></div>${screeningsList(up)}</section>
<section class="section"><h3>${t("allFilms")}</h3><div class="grid-posters">${ordered().map(posterCard).join("")}</div></section>
${(lang === "he" ? SITE_HE.tagline : SITE.tagline) ? `<section class="section"><p class="statement">${esc(lang === "he" ? SITE_HE.tagline : SITE.tagline)}</p></section>` : ""}
</div>`;
}
function pageList(kind) {
const list = ordered().filter(f => f.status === kind);
return `<div class="wrap"><section class="film-head"><h1>${kind === "released" ? t("films") : t("prod")}</h1></section>
<section class="section" style="border:0"><div class="grid-posters">${list.map(posterCard).join("")}</div></section></div>`;
}
function pageFilm(f) {
const media = M(f), gallery = media.gallery.slice(1).map(id => frame("r169", "", "", "", id, 1400)).join("");
const syn = L(f, "synopsis"), quotes = L(f, "quotes"), awards = L(f, "awards"), links = linksOf(f);
const team = L(f, "team"), tech = L(f, "tech"), pitching = L(f, "pitching");
const pTitle = (lang === "he" && (HE[f.slug] || {}).pitchingTitle) || t("pitching");
const runtime = lang === "he" ? ((tech.find(x => x[0] === "משך") || [])[1] || "") : f.runtime;
const country = (tech.find(x => /countr|הפקה$/i.test(x[0]) && !/שנת|שלב/.test(x[0])) || [])[1];
const mine = SCREENINGS.filter(s => s.slug === f.slug && new Date(s.date + "T23:59:59") >= new Date());
const blocks = [];
if (syn) blocks.push(`<p class="syn">${esc(syn)}</p>`);
if (f.status === "released") blocks.push(`<div id="screenings"><h3>${t("screenings")}</h3>${mine.length ? screeningsList(mine, false) : `<div class="screen-empty">${t("fromCV")}</div>`}</div>`);
const side = [];
if (team.length) side.push(`<div><h3>${t("team")}</h3><dl class="credits">${team.map(([r, n]) => `<dt>${esc(r)}</dt><dd>${esc(n)}</dd>`).join("")}</dl></div>`);
if (tech.length) side.push(`<div><h3>${t("tech")}</h3><dl class="credits">${tech.map(([r, n]) => `<dt>${esc(r)}</dt><dd>${esc(n)}</dd>`).join("")}</dl></div>`);
if (pitching.length) side.push(`<div><h3>${esc(pTitle)}</h3><ul class="plain">${pitching.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`);
if (links.length) side.push(`<div><h3>${t("links")}</h3><ul class="plain">${links.map(([x, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(x)} ↗</a></li>`).join("")}</ul></div>`);
const laurels = media.laurels.length ? `<section class="section laurels-band"><div class="laurels">${media.laurels.map(id => `<img src="${img(id, 360)}" alt="" loading="lazy">`).join("")}</div></section>` : "";
const partners = media.partners.length ? `<section class="section"><h3>${t("supported")}</h3><div class="logos">${media.partners.map((id, i) => `<img src="${img(id, 300)}" alt="${esc(f.partners[i] || "")}" loading="lazy">`).join("")}</div></section>` : "";
return `<section class="film-hero">
${key(f) ? `<img class="bg" src="${img(key(f), 2400)}" alt="">` : ""}
<div class="wrap hero-in">
<div class="hero-text">
<div class="eyebrow">${f.status === "production" ? t("inProd") : t("doc")} · ${f.year}</div>
<h1>${esc(L(f, "title"))}</h1>
${L(f, "byline") ? `<div class="meta"><span>${esc(L(f, "byline"))}</span></div>` : ""}
<p class="lede">${esc(L(f, "logline"))}</p>
<div class="meta">${runtime ? `<span>${esc(runtime)}</span>` : ""}${country ? `<span>${esc(country)}</span>` : ""}</div>
</div>
${media.poster ? `<img class="hero-poster" src="${img(media.poster, 700)}" alt="${esc(L(f, "title"))}">` : ""}
</div>
</section>
<div class="wrap">
${f.trailer ? `<a class="frame r169 trailer" href="${esc(f.trailer)}" target="_blank" rel="noopener"><span class="play">${t("trailer")}</span><span class="cap">VIMEO</span></a>` : ""}
${awards.length ? `<section class="section"><ul class="awards">${awards.map(a => `<li>★ ${esc(a)}</li>`).join("")}</ul></section>` : ""}
${quotes.length ? `<section class="section"><ul class="quotes">${quotes.map(([q, s]) => `<li><q>${esc(q)}</q><span>${esc(s)}</span></li>`).join("")}</ul></section>` : ""}
${laurels}
${gallery ? `<section class="section"><div class="gallery g${media.gallery.length - 1}">${gallery}</div></section>` : ""}
<section class="section"><div class="cols"><div class="stack">${blocks.join("")}</div><div class="stack">${side.join("")}</div></div></section>
${partners}
</div>`;
}
function pageBio() {
const people = lang === "he" ? SITE_HE.people : SITE.people;
return `<div class="wrap"><section class="film-head"><h1>${t("bio")}</h1>${(lang === "he" ? SITE_HE.tagline : SITE.tagline) ? `<p class="lede">${esc(lang === "he" ? SITE_HE.tagline : SITE.tagline)}</p>` : ""}</section>
<section class="section"><div class="people">${people.map((p, i) => `<div class="person">${frame("r45", "", "", "", SITE_MEDIA.portraits[i], 900)}<h2>${esc(p.name)}</h2><p>${esc(p.bio)}</p></div>`).join("")}</div></section>
<section class="section"><div class="contact"><h3>${t("contact")}</h3>${lang === "he" ? `<span style="direction:rtl;font-family:var(--he)">${esc(SITE_HE.company)}</span>` : ""}<span>${esc(lang === "he" ? SITE_HE.phone : SITE.phone)}</span>${SITE.emails.map(e => `<span>${esc(e)}</span>`).join("")}</div></section></div>`;
}
function footer() {
return `<div class="wrap"><span dir="ltr">© ${new Date().getFullYear()} uvs films</span><nav>${SITE.social.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join("")}</nav></div>`;
}
let timer = null;
function startShow() {
clearInterval(timer);
const slides = [...document.querySelectorAll(".slide")], thumbs = [...document.querySelectorAll(".thumb")];
if (!slides.length) return;
let cur = 0;
const go = n => {
cur = (n + slides.length) % slides.length;
slides.forEach((s, i) => s.classList.toggle("on", i === cur));
thumbs.forEach((b, i) => { b.classList.remove("on"); if (i === cur) { void b.offsetWidth; b.classList.add("on"); } });
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tick = () => { clearInterval(timer); if (!reduce) timer = setInterval(() => go(cur + 1), 6000); };
$("#prev").onclick = () => { go(cur - 1); tick(); };
$("#next").onclick = () => { go(cur + 1); tick(); };
thumbs.forEach(b => b.onclick = () => { go(+b.dataset.go); tick(); });
tick();
}
let edSlug = "tfl", edLang = "en";
const LISTS = [
["quotes", "ציטוטים מביקורות", ["ציטוט", "מקור"], true],
["awards", "פרסים ומועמדויות", null, true],
["laurels", "פסטיבלים", null, false],
["team", "צוות", ["תפקיד", "שם"], true],
["tech", "פרטים טכניים", ["שדה", "ערך"], true],
["pitching", "אירועי פיצ'ינג", null, true],
["partners", "תומכים ולוגואים", null, false],
["links", "קישורים", ["טקסט", "כתובת"], false]
];
const src = (f, key, perLang) => {
if (edLang === "he" && perLang) { HE[f.slug] = HE[f.slug] || {}; if (!HE[f.slug][key]) HE[f.slug][key] = ["quotes","awards","team","tech","pitching","links"].includes(key) ? [] : ""; return HE[f.slug]; }
return f;
};
function pageEdit() {
const f = bySlug(edSlug), he = edLang === "he", dirCls = he ? "rtl" : "ltr";
const g = k => esc(src(f, k, true)[k]);
const opts = FILMS.map(x => `<option value="${x.slug}" ${x.slug === edSlug ? "selected" : ""}>${esc(x.title)}</option>`).join("");
const lists = LISTS.map(([key, label, cols, perLang]) => {
const arr = src(f, key, perLang)[key];
const rows = arr.map((v, i) => cols
? `<div class="row"><input class="${perLang ? dirCls : "ltr"}" id="${key}-${i}-0" data-k="${key}" data-p="${perLang ? 1 : 0}" data-i="${i}" data-j="0" value="${esc(v[0])}" aria-label="${cols[0]}"><input class="${perLang ? dirCls : "ltr"}" id="${key}-${i}-1" data-k="${key}" data-p="${perLang ? 1 : 0}" data-i="${i}" data-j="1" value="${esc(v[1])}" aria-label="${cols[1]}"><button class="x" data-del="${key}" data-p="${perLang ? 1 : 0}" data-i="${i}" title="מחק">×</button></div>`
: `<div class="row one"><input class="${perLang ? dirCls : "ltr"}" id="${key}-${i}" data-k="${key}" data-p="${perLang ? 1 : 0}" data-i="${i}" value="${esc(v)}"><button class="x" data-del="${key}" data-p="${perLang ? 1 : 0}" data-i="${i}" title="מחק">×</button></div>`).join("");
return `<details class="more" data-list="${key}"><summary><span>${label} · ${arr.length}${!perLang && he ? " <small>(משותף לשתי השפות)</small>" : ""}</span><span class="plus">+</span></summary>
<div class="rows">${rows}<button class="add" data-add="${key}" data-p="${perLang ? 1 : 0}">הוסף שורה</button></div></details>`;
}).join("");
return `<div class="ed">
<aside class="ed-form">
<div class="ed-top"><h2>עריכת עמוד סרט</h2><a class="btn" href="${he ? "#he-" : "#"}f-${f.slug}" style="font-family:var(--he);letter-spacing:0">חזרה לאתר</a></div>
<div class="f"><label for="pick">סרט</label><select id="pick">${opts}</select></div>
<div class="seg" role="group" aria-label="שפה"><button data-lg="he" class="${he ? "on" : ""}">עברית</button><button data-lg="en" class="${he ? "" : "on"}">English</button></div>
<div class="seg" role="group" aria-label="מצב"><button data-st="released" class="${f.status === "released" ? "on" : ""}">יצא</button><button data-st="production" class="${f.status === "production" ? "on" : ""}">בהפקה</button></div>
<div class="f"><label for="title">שם הסרט</label><input class="${dirCls}" id="title" data-f="title" value="${g("title")}"></div>
<div class="f" style="grid-template-columns:1fr 1fr;column-gap:8px"><label for="year">שנה</label><label for="runtime">אורך</label>
<input class="ltr" id="year" data-f="year" data-shared="1" value="${esc(f.year)}"><input class="ltr" id="runtime" data-f="runtime" data-shared="1" value="${esc(f.runtime)}"></div>
<div class="f"><label for="logline">משפט מפתח</label><textarea class="${dirCls}" id="logline" data-f="logline" style="min-height:70px">${g("logline")}</textarea></div>
<div class="f"><label for="synopsis">תקציר</label><textarea class="${dirCls}" id="synopsis" data-f="synopsis">${g("synopsis")}</textarea></div>
${lists}
<div class="note">הקרנות: <b>נשאבות אוטומטית מסינברס</b>. לא מקלידים כאן.</div>
<div class="note">גרסת הדגמה: השינויים נראים מיד בצד, אבל עוד לא נשמרים.</div>
</aside>
<section class="ed-preview"><div class="tag"><span>תצוגה חיה · ${he ? "עברית" : "אנגלית"}</span><i>מתעדכן תוך כדי הקלדה</i></div><div id="live" dir="${he ? "rtl" : "ltr"}"></div></section>
</div>`;
}
function bindEditor() {
const f = bySlug(edSlug), live = $("#live");
const redraw = () => { const keep = lang; lang = edLang; live.innerHTML = pageFilm(f); lang = keep; };
redraw();
$("#pick").onchange = e => { edSlug = e.target.value; render(); };
document.querySelectorAll("[data-lg]").forEach(b => b.onclick = () => { edLang = b.dataset.lg; render(); });
document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { f.status = b.dataset.st; render(); });
document.querySelectorAll("[data-f]").forEach(el => el.oninput = () => { (el.dataset.shared ? f : src(f, el.dataset.f, true))[el.dataset.f] = el.value; redraw(); });
document.querySelectorAll("[data-k]").forEach(el => el.oninput = () => {
const arr = src(f, el.dataset.k, el.dataset.p === "1")[el.dataset.k], i = +el.dataset.i;
if (el.dataset.j !== undefined) arr[i][+el.dataset.j] = el.value; else arr[i] = el.value;
redraw();
});
const reopen = key => { render(); const d = document.querySelector(`[data-list="${key}"]`); if (d) d.open = true; };
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
const key = b.dataset.add, two = LISTS.find(l => l[0] === key)[2];
src(f, key, b.dataset.p === "1")[key].push(two ? ["", ""] : ""); reopen(key);
});
document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { src(f, b.dataset.del, b.dataset.p === "1")[b.dataset.del].splice(+b.dataset.i, 1); reopen(b.dataset.del); });
}
function render() {
clearInterval(timer);
let h = (location.hash || "#home").slice(1);
lang = h.startsWith("he-") ? "he" : "en";
if (lang === "he") h = h.slice(3);
if (h === "edit") lang = "he";
document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
document.documentElement.lang = lang;
let html, navKey = h;
if (h === "films") html = pageList("released");
else if (h === "in-production") html = pageList("production");
else if (h === "bio") html = pageBio();
else if (h === "edit") html = pageEdit();
else if (h.startsWith("f-")) {
const f = bySlug(h.slice(2));
html = f ? pageFilm(f) : pageHome();
if (f) { edSlug = f.slug; edLang = lang; navKey = f.status === "production" ? "in-production" : "films"; }
} else { html = pageHome(); navKey = "home"; }
$("#nav").innerHTML = [["home", "home"], ["films", "films"], ["in-production", "prod"], ["bio", "bio"]]
.map(([r, k]) => `<a href="${R(r)}" class="${r === navKey ? "on" : ""}">${t(k)}</a>`).join("");
$("#logo").href = R("home");
const other = lang === "he" ? "#" + h : "#he-" + h;
$("#lang").href = h === "edit" ? "#home" : other;
$("#lang").textContent = h === "edit" ? "לאתר" : t("switchTo");
$("#app").innerHTML = html;
$("#foot").innerHTML = footer();
$("#foot").hidden = h === "edit";
$("#fab").hidden = h === "edit";
if (h === "edit") bindEditor();
if (navKey === "home" && !h.startsWith("f-")) startShow();
window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();
</script>
</html>
